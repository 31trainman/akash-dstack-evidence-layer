---
version: "2.1"

services:
  dstack-bridge:
    image: ghcr.io/31trainman/akash-dstack-evidence-layer:latest
    env:
      - CONFIG_ID=akash-dstack-poc-v0.2
      - IMAGE_ID=REPLACE_WITH_IMMUTABLE_IMAGE_DIGEST
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
    params:
      tee: cpu-gpu

profiles:
  compute:
    dstack-bridge:
      resources:
        cpu:
          units: 1
        memory:
          size: 1Gi
        storage:
          size: 2Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: pro6000se
                  ram: 96Gi
                  interface: pcie

  placement:
    tee-provider:
      pricing:
        dstack-bridge:
          denom: uact
          amount: 10000

deployment:
  dstack-bridge:
    tee-provider:
      profile: dstack-bridge
      count: 1
