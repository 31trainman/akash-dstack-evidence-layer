---
version: "2.1"
services:
  evidence-guest:
    image: ghcr.io/31trainman/akash-dstack-evidence-guest@sha256:REPLACE_WITH_GUEST_DIGEST
    env:
      - BRIDGE_URL=https://YOUR_PUBLIC_VERIFIER_ENDPOINT
      - BRIDGE_API_TOKEN=REPLACE_WITH_SHORT_LIVED_TEST_TOKEN
      - IMAGE_MANIFEST_DIGEST=sha256:REPLACE_WITH_THIS_GUEST_IMAGE_DIGEST
      - RESOLVED_CONFIG_DIGEST=sha256:REPLACE_AFTER_KATA_CONFIG_BINDING_IS_AVAILABLE
      - AKASH_ATTESTATION_SIDECAR=http://127.0.0.1:8790
    params:
      tee: cpu-gpu
profiles:
  compute:
    evidence-guest:
      resources:
        cpu:
          units: 1
        memory:
          size: 1Gi
        storage:
          size: 2Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: pro6000se
                  ram: 96Gi
                  interface: pcie
  placement:
    tee-provider:
      pricing:
        evidence-guest:
          denom: uact
          amount: 10000
deployment:
  evidence-guest:
    tee-provider:
      profile: evidence-guest
      count: 1
