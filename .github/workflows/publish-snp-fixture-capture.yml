name: Publish SNP fixture capture image

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the reviewed image to public GHCR
        required: true
        default: false
        type: boolean
      source_sha:
        description: Exact reviewed source commit to package
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/akash-dstack-snp-fixture-capture
  APPROVED_SOURCE_SHA: ef571a72c4f4928d1d93245fe5698854fd285f01

jobs:
  build-smoke-publish:
    if: inputs.confirm_publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      immutable-reference: ${{ steps.reference.outputs.value }}

    steps:
      - name: Require the approved source commit
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "${REQUESTED_SOURCE_SHA}" != "${APPROVED_SOURCE_SHA}" ]]; then
            echo "Refusing to publish unapproved source SHA." >&2
            exit 1
          fi

      - name: Require a public source repository
        shell: bash
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            echo "The source repository must be public so a new linked GHCR package inherits public visibility." >&2
            exit 1
          fi

      - name: Check out exact reviewed source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${REQUESTED_SOURCE_SHA}"
          test "${actual_sha}" = "${APPROVED_SOURCE_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.snp-fixture-capture
          platforms: linux/amd64
          load: true
          push: false
          tags: snp-fixture-capture:smoke

      - name: Smoke-test packaged capture entrypoint without hardware
        shell: bash
        run: |
          output=$(docker run --rm --platform linux/amd64 snp-fixture-capture:smoke --version)
          test "${output}" = "capture_snp_fixture 1.0.0"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit-addressed Linux amd64 image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.snp-fixture-capture
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.source_sha }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        id: reference
        shell: bash
        run: |
          reference="${REGISTRY}/${IMAGE_NAME}@${{ steps.publish.outputs.digest }}"
          echo "value=${reference}" >> "${GITHUB_OUTPUT}"
          echo "### Published SNP fixture capture image" >> "${GITHUB_STEP_SUMMARY}"
          echo "Source: \`${{ inputs.source_sha }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: \`${reference}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Prove the published image is publicly readable
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          docker logout "${REGISTRY}"
          docker image rm \
            "${REGISTRY}/${IMAGE_NAME}:sha-${SOURCE_SHA}" 2>/dev/null || true
          docker pull --platform linux/amd64 \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.publish.outputs.digest }}"
