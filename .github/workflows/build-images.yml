name: Build evidence images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bridge
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akash-dstack-evidence-bridge:${{ github.sha }}

      - name: Build and push guest image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.guest
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akash-dstack-evidence-guest:${{ github.sha }}
