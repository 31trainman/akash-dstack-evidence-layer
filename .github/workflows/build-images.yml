name: Build evidence images

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - feature/rust-python-trust-boundary
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Build locked Rust verifier
        run: cargo build --locked --manifest-path rust-verifier/Cargo.toml

      - name: Run all non-hardware locked Rust tests
        run: cargo test --locked --manifest-path rust-verifier/Cargo.toml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt PyYAML==6.0.2

      - name: Run full Python test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q service verifier tests

      - name: Validate all Akash YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [Path("deploy.yaml"), *sorted(Path("deploy").glob("*.yaml"))]
          for path in files:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"parsed {path}")
          print(f"parsed {len(files)} Akash YAML files")
          PY

      - name: Check patch whitespace
        run: |
          git diff --check
          git diff --check HEAD^ HEAD

      - name: Build bridge image
        run: docker build --file Dockerfile.bridge --tag akash-dstack-evidence-bridge:ci .

      - name: Build guest image
        run: docker build --file Dockerfile.guest --tag akash-dstack-evidence-guest:ci .

      - name: Verify packaged Rust verifier protocol
        run: |
          docker run --rm --entrypoint python akash-dstack-evidence-bridge:ci -c '
          import json, os, subprocess
          binary = "/usr/local/bin/akash-coco-snp-verifier"
          assert os.path.isfile(binary) and os.access(binary, os.X_OK)
          request = {
              "protocol_version": 0,
              "evidence_type": "sev-snp",
              "evidence": {"report_b64": "AA==", "cert_chain": ""},
              "expected_workload_commitment_hex": "00" * 32,
              "expected_init_data_hash_hex": None,
          }
          result = subprocess.run(
              [binary],
              input=json.dumps(request, separators=(",", ":")).encode("ascii"),
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              timeout=10,
              check=False,
          )
          assert result.returncode == 1, result.returncode
          assert result.stderr == b"", result.stderr
          assert 0 < len(result.stdout) <= 4096, len(result.stdout)
          response = json.loads(result.stdout)
          assert response["protocol_version"] == 1, response
          assert response["outcome"] == "error", response
          assert response["error"]["category"] == "InvalidInput", response
          assert response["error"]["code"] == "E_INVALID_INPUT", response
          '

  detect-current-snp-fixture:
    name: Detect genuine current SNP fixture
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.fixture.outputs.present }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report fixture status
        id: fixture
        shell: bash
        run: |
          fixture=rust-verifier/tests/fixtures/snp-v3-current
          required=(report.bin vcek.der amd-cert-chain.pem metadata.json SHA256SUMS README.md)
          missing=()
          for file in "${required[@]}"; do
            test -f "${fixture}/${file}" || missing+=("${file}")
          done
          if ((${#missing[@]})); then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "### SNP production readiness: NOT SATISFIED" >> "${GITHUB_STEP_SUMMARY}"
            echo "Genuine current fixture files are absent: ${missing[*]}" >> "${GITHUB_STEP_SUMMARY}"
            echo "Normal CI may pass, but that does not establish SNP production readiness." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "present=true" >> "${GITHUB_OUTPUT}"
            echo "### Current SNP fixture detected" >> "${GITHUB_STEP_SUMMARY}"
            echo "The separate cryptographic fixture job must pass before readiness can be claimed." >> "${GITHUB_STEP_SUMMARY}"
          fi

  current-snp-fixture-validation:
    name: SNP production fixture (skipped = NOT SATISFIED)
    needs:
      - test-and-build
      - detect-current-snp-fixture
    if: needs.detect-current-snp-fixture.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Validate captured evidence through pinned Trustee
        run: rust-verifier/scripts/validate-snp-fixture.sh
