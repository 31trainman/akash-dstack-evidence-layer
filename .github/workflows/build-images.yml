name: Build evidence images
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bridge
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akash-dstack-evidence-bridge:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.guest
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/akash-dstack-evidence-guest:latest
